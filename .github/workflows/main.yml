name: PC VIRTUAL QEMU PINGGY

on:
  workflow_dispatch:

jobs:
  qemu-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar Ambiente QEMU e KVM
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils curl ssh

      - name: Baixar Imagem do Windows e Iniciar QEMU
        run: |
          curl -L -o win10.qcow2 "https://app.box.com/shared/static/4v3z4m3m3l8f0e5y9y9x.qcow2"
          
          qemu-system-x86_64 \
            -m 8G \
            -smp cores=2 \
            -cpu host \
            -enable-kvm \
            -vga std \
            -net nic,model=virtio \
            -net user,hostfwd=tcp::3389-:3389 \
            -hda win10.qcow2 &

      - name: Iniciar Tunel Pinggy (Sem Cartao)
        run: |
          # Abre o túnel SSH gratuito via Pinggy
          ssh -p 443 -R0:localhost:3389 -o StrictHostKeyChecking=no a.pinggy.io > pinggy.log 2>&1 &
          sleep 5
          
          echo "=========================================="
          echo "DADOS DE CONEXAO RDP:"
          cat pinggy.log | grep -o 'tcp://[^"]*' || cat pinggy.log
          echo ""
          echo "Usuario: Administrator"
          echo "Senha: Admin123Password#"
          echo "=========================================="

      - name: Manter Conexao Ativa
        run: |
          while true; do
            sleep 300
            echo "[$(date)] QEMU VM Ativa"
          done
          
