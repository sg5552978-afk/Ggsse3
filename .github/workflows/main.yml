name: PC VIRTUAL QEMU NGROK

on:
  workflow_dispatch:

jobs:
  qemu-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar Ambiente QEMU e KVM
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils curl

      - name: Baixar e Configurar Ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          curl -s https://bin.equinox.io/c/b4Pvu3qMcdy/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          tar -xvzf ngrok.tgz
          ./ngrok config add-authtoken $NGROK_TOKEN

      - name: Baixar Imagem do Windows e Iniciar QEMU
        run: |
          curl -L -o win10.qcow2 "https://app.box.com/shared/static/4v3z4m3m3l8f0e5y9y9x.qcow2"
          
          qemu-system-x86_64 \
            -m 8G \
            -smp cores=2 \
            -cpu host \
            -enable-kvm \
            -vga std \
            -net nic,model=virtio \
            -net user,hostfwd=tcp::3389-:3389 \
            -hda win10.qcow2 &

      - name: Iniciar Tunel Ngrok
        run: |
          ./ngrok tcp 3389 --log=stdout > ngrok.log &
          sleep 5
          
          echo "=========================================="
          echo "DADOS DE CONEXAO RDP:"
          curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[^"]*'
          echo "Usuario: Administrator"
          echo "Senha: Admin123Password#"
          echo "=========================================="

      - name: Manter Conexao Ativa
        run: |
          while true; do
            sleep 300
            echo "[$(date)] QEMU VM Ativa"
          done
          
